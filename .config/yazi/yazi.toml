[opener]
text = [
    { run = 'nvim "$@"', desc = "nvim", block = true },
]
markdown = [
    { run = 'md-viewer "$@"', desc = "md-viewer", orphan = true },
]

[open]
prepend_rules = [
    { mime = "text/markdown", use = "markdown" },
    { url = "*.md", use = "markdown" },
    { mime = "text/*", use = "text" },
]
