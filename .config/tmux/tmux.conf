# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Base index
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Settings
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",foot:RGB"
set -sg escape-time 10
set -g focus-events on

# Vi mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane navigation without prefix (Alt+hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Splits without prefix awkwardness
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Status bar position
set -g status-position top
set -g status-interval 1

# Status bar styling
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=blue,bold] #S "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#[fg=brightblack]%H:%M "
set -g status-left-length 20
set -g status-right-length 40

# Window status
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# Message style
set -g message-style "bg=default,fg=blue"

# Source wallust colors
if-shell "test -f ~/.config/wallust/tmux-colors.conf" "source-file ~/.config/wallust/tmux-colors.conf"
